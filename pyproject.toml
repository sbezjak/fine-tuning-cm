[project]
name = "ft_cm"
version = "0.1.0"
description = "Defensive content-moderation classifier: a bounded LoRA/SFT fine-tuning study on Apple Silicon."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-html>=4",
    "respx>=0.21",
    "ruff>=0.6",
]
# The Apple-Silicon training path. Isolated in its own group so the eval harness
# and the mocked test suite install and run without pulling the MLX stack.
train = [
    "mlx>=0.18",
    "mlx-lm>=0.18",
]
# The real-dataset pull. Isolated too, so the mocked suite + eval harness never
# install it - only scripts/download-dataset.sh needs it. TARGETED, not streamed:
# DuckDB queries the HF-hosted parquet of google/civil_comments (CC0) with predicate
# pushdown (WHERE subscore >= tau), pulling only the rare harm rows instead of
# streaming + discarding ~99%. huggingface-hub pins + resolves the dataset revision.
# Raw text lands git-ignored under data/real/.
data = [
    "duckdb>=1.1",
    "huggingface-hub>=0.24",
]
# The CUDA-path eval: load a cloud-trained HF PEFT adapter LOCALLY (CPU/MPS, no
# bitsandbytes - that is CUDA-only) so the SAME frozen holdout runs through the
# SAME eval harness via a PEFTProvider. Isolated like the others: the mocked suite
# and the MLX path never pull torch/transformers/peft. This is the "train on the
# cloud T4, keep the Mac for the eval harness" split made real.
peft = [
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.13",
    "safetensors>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["ft_cm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mocked: fast unit tests, HTTP mocked with respx, no model or network",
    "ollama: requires live Ollama at localhost:11434 (free local judge/eval)",
    "mlx: requires the MLX training stack and a downloaded base model (slow, local)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
